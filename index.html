<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贵金属实时报价</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            font-weight: 600;
            -webkit-text-size-adjust: 100%;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #ffd700, #ffec8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        
        .update-time {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            font-weight: 400;
        }
        
        /* 选项卡导航 */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 5px;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: #aaa;
        }
        .tab-btn.active {
            background: #ffd700;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(255,215,0,0.3);
        }
        
        /* 内容区域 */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .price-row:last-child {
            border-bottom: none;
        }
        
        .metal-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .metal-icon {
            width: 50px;
            height: 30px;
            border-radius: 6px;
            background: #ffd700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .metal-name span {
            font-size: 20px;
            font-weight: 700;
        }
        
        .price-value {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b6b;
        }
        
        .price-unit {
            font-size: 12px;
            color: #888;
            margin-left: 4px;
            font-weight: 400;
        }
        
        .brand-section {
            margin-top: 10px;
        }
        
        .brand-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .brand-name {
            color: #ccc;
            font-size: 20px;
            font-weight: 700;
        }

        .data-source-tip {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 10px;
            font-weight: 400;
        }
        
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #ffd700;
            padding: 15px 30px;
            border-radius: 40px;
            z-index: 2000;
            display: none;
            font-weight: 700;
            box-shadow: 0 0 20px #ffd70040;
            border: 1px solid #ffd700;
        }
        
        .toast.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>贵金属实时报价</h1>
            <div class="update-time" id="updateTime">数据加载中...</div>
        </div>
        
        <!-- 选项卡导航 -->
        <div class="tab-nav">
            <div class="tab-btn active" data-tab="recycle">回收价格</div>
            <div class="tab-btn" data-tab="sale">销售价格</div>
        </div>
        
        <!-- 回收价格内容 -->
        <div id="recycleTab" class="tab-content active">
            <div class="section">
                <div class="section-title">回收价格（元/克）</div>
                <div id="recyclePrices">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- 销售价格内容 -->
        <div id="saleTab" class="tab-content">
            <div class="section">
                <div class="section-title">销售价格（元/克）</div>
                <div id="salePrices">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
        
        <div class="data-source-tip">数据源: gold-api.com + exchangerate-api.com | 每15秒自动刷新（页面不可见时暂停）</div>
    </div>
    
    <!-- 提示消息（仅用于网络错误提醒） -->
    <div class="toast" id="toast">⚠️ 数据获取失败，使用上次缓存价格</div>
    
    <script>
        // ==================== 固定差价配置（无需后台管理） ====================
        const PRICE_CONFIG = {
            recycle: {
                gold: 40,          // 黄金999
                gold990: 50,       // 黄金990
                silver: 4,         // 银999
                silver990: 5,      // 银990
                silver925: 7,      // 银925
                platinum: 120,
                palladium: 170
            },
            sale: {
                baosheng: 100,
                laofengxiang: 200,
                laomiao: 190,
                mengjinyuan: 180,
                zhongguo: 170,
                silver: 11
            }
        };

        // 最后一次成功获取的基础价格 (美元/盎司)
        let basePricesUSD = {
            gold: 1900.0,
            silver: 23.0,
            platinum: 900.0,
            palladium: 1000.0
        };
        // 最新汇率 (USD/CNY)
        let usdCnyRate = 7.2;
        
        // 定时器ID
        let refreshTimer = null;
        // 刷新间隔（毫秒）15秒
        const REFRESH_INTERVAL = 15000;

        // 显示提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 选项卡切换
        function initTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = {
                recycle: document.getElementById('recycleTab'),
                sale: document.getElementById('saleTab')
            };
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const target = tab.dataset.tab;
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    Object.keys(contents).forEach(key => {
                        contents[key].classList.remove('active');
                    });
                    contents[target].classList.add('active');
                });
            });
        }

        // ---------- 尾数处理函数 ----------
        // 向下取整至最近的0或5结尾（用于回收价）
        function floorTo5or0(num) {
            const remainder = num % 10;
            if (remainder < 5) {
                return num - remainder;
            } else {
                return num - remainder + 5;
            }
        }

        // 向上取整至最近的8结尾（用于品牌销售价）
        function ceilTo8(num) {
            const remainder = num % 10;
            if (remainder <= 8) {
                return num - remainder + 8;
            } else {
                return num + 10 - remainder + 8;
            }
        }

        // 将美元/盎司转换为人民币/克
        function usdPerOunceToCnyPerGram(usdPrice) {
            return (usdPrice * usdCnyRate) / 31.10348;
        }

        // ---------- API获取数据 ----------
        async function fetchPrices() {
            try {
                // 1. 获取美元兑人民币汇率
                const rateRes = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                if (!rateRes.ok) throw new Error('汇率API响应失败');
                const rateData = await rateRes.json();
                const cnyRate = rateData.rates.CNY;
                if (!cnyRate) throw new Error('未找到CNY汇率');
                usdCnyRate = cnyRate;

                // 2. 并发获取四种金属的美元价格 (gold-api.com)
                const symbols = ['XAU', 'XAG', 'XPT', 'XPD'];
                const fetchPromises = symbols.map(async (sym) => {
                    const res = await fetch(`https://api.gold-api.com/price/${sym}`);
                    if (!res.ok) throw new Error(`${sym}价格获取失败`);
                    return res.json();
                });
                const results = await Promise.all(fetchPromises);

                // 3. 解析价格
                results.forEach((item, index) => {
                    const sym = symbols[index];
                    const priceUSD = item.price;
                    if (priceUSD === undefined) throw new Error(`${sym}价格字段缺失`);
                    switch (sym) {
                        case 'XAU': basePricesUSD.gold = priceUSD; break;
                        case 'XAG': basePricesUSD.silver = priceUSD; break;
                        case 'XPT': basePricesUSD.platinum = priceUSD; break;
                        case 'XPD': basePricesUSD.palladium = priceUSD; break;
                    }
                });

                updateDisplay();
            } catch (error) {
                console.error('API请求失败:', error);
                showToast('⚠️ 网络波动，使用上次缓存价格');
                updateDisplay(); // 使用缓存价格继续显示
            }
        }

        // 更新页面显示
        function updateDisplay() {
            // 计算人民币基础价格 (每克)
            const basePricesCNY = {
                gold: usdPerOunceToCnyPerGram(basePricesUSD.gold),
                silver: usdPerOunceToCnyPerGram(basePricesUSD.silver),
                platinum: usdPerOunceToCnyPerGram(basePricesUSD.platinum),
                palladium: usdPerOunceToCnyPerGram(basePricesUSD.palladium)
            };

            // 回收价格计算
            const gold999Base = basePricesCNY.gold - PRICE_CONFIG.recycle.gold;
            const gold999Final = floorTo5or0(Math.round(gold999Base));

            const gold990Base = basePricesCNY.gold - PRICE_CONFIG.recycle.gold990;
            const gold990Final = floorTo5or0(Math.round(gold990Base));

            const gold750Final = floorTo5or0(Math.round(gold999Final * 0.72));
            const gold916Final = floorTo5or0(Math.round(gold999Final * 0.9));

            const silverFinal = Math.round(basePricesCNY.silver - PRICE_CONFIG.recycle.silver);
            const silver990Final = Math.round(basePricesCNY.silver - PRICE_CONFIG.recycle.silver990);
            const silver925Final = Math.round(basePricesCNY.silver - PRICE_CONFIG.recycle.silver925);
            const platinumFinal = Math.round(basePricesCNY.platinum - PRICE_CONFIG.recycle.platinum);
            const palladiumFinal = Math.round(basePricesCNY.palladium - PRICE_CONFIG.recycle.palladium);

            const recyclePrices = {
                gold: gold999Final,
                gold990: gold990Final,
                gold750: gold750Final,
                gold916: gold916Final,
                silver: silverFinal,
                silver990: silver990Final,
                silver925: silver925Final,
                platinum: platinumFinal,
                palladium: palladiumFinal
            };

            // 销售价格计算
            const baoshengBase = basePricesCNY.gold + PRICE_CONFIG.sale.baosheng;
            const laofengxiangBase = basePricesCNY.gold + PRICE_CONFIG.sale.laofengxiang;
            const laomiaoBase = basePricesCNY.gold + PRICE_CONFIG.sale.laomiao;
            const mengjinyuanBase = basePricesCNY.gold + PRICE_CONFIG.sale.mengjinyuan;
            const zhongguoBase = basePricesCNY.gold + PRICE_CONFIG.sale.zhongguo;

            const salePrices = {
                baosheng: ceilTo8(Math.round(baoshengBase)),
                laofengxiang: ceilTo8(Math.round(laofengxiangBase)),
                laomiao: ceilTo8(Math.round(laomiaoBase)),
                mengjinyuan: ceilTo8(Math.round(mengjinyuanBase)),
                zhongguo: ceilTo8(Math.round(zhongguoBase)),
                silver: Math.round(basePricesCNY.silver + PRICE_CONFIG.sale.silver)
            };
            
            // 更新回收价格显示
            document.getElementById('recyclePrices').innerHTML = `
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au999</div>
                        <span>黄金999</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au990</div>
                        <span>黄金990</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold990}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au750</div>
                        <span>黄金750</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold750}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au916</div>
                        <span>黄金916</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold916}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Ag999</div>
                        <span>银999</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.silver}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Ag990</div>
                        <span>银990</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.silver990}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Ag925</div>
                        <span>银925</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.silver925}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Pt</div>
                        <span>铂金</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.platinum}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Pd</div>
                        <span>钯金</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.palladium}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
            `;
            
            // 更新销售价格显示
            document.getElementById('salePrices').innerHTML = `
                <div class="brand-section">
                    <div class="brand-item">
                        <span class="brand-name">宝盛黄金</span>
                        <div>
                            <span class="price-value">${salePrices.baosheng}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">老凤祥黄金</span>
                        <div>
                            <span class="price-value">${salePrices.laofengxiang}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">老庙黄金</span>
                        <div>
                            <span class="price-value">${salePrices.laomiao}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">梦金园黄金</span>
                        <div>
                            <span class="price-value">${salePrices.mengjinyuan}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">中国黄金</span>
                        <div>
                            <span class="price-value">${salePrices.zhongguo}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">足银</span>
                        <div>
                            <span class="price-value">${salePrices.silver}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                </div>
            `;
            
            // 更新时间
            const now = new Date();
            document.getElementById('updateTime').innerHTML = 
                `更新时间：${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        // ---------- 轮询管理：页面可见时启动定时器，不可见时清除 ----------
        function startPolling() {
            if (refreshTimer) return; // 已存在定时器则不再重复创建
            refreshTimer = setInterval(() => {
                fetchPrices();
            }, REFRESH_INTERVAL);
        }

        function stopPolling() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
        }

        // 页面可见性变化处理
        function handleVisibilityChange() {
            if (document.hidden) {
                // 页面隐藏，停止轮询
                stopPolling();
            } else {
                // 页面重新可见，立即刷新一次数据，然后重新启动轮询
                fetchPrices();
                startPolling();
            }
        }

        // 初始化可见性监听
        function initVisibilityPolling() {
            // 监听页面可见性变化
            document.addEventListener('visibilitychange', handleVisibilityChange);
            // 初始状态：如果页面可见则启动轮询，否则不启动（但初始加载时总会调用一次fetchPrices，见下方init）
            if (!document.hidden) {
                startPolling();
            }
        }

        // 整体初始化
        function init() {
            initTabs();
            // 首次获取数据（不依赖定时器）
            fetchPrices();
            // 设置可见性轮询管理
            initVisibilityPolling();
        }

        // 启动应用
        init();
    </script>
</body>
</html>
