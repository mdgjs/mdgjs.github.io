<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贵金属实时报价</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', '微软雅黑', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            font-weight: 600;
            -webkit-text-size-adjust: 100%;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #ffd700, #ffec8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
        
        .update-time {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            font-weight: 400;
        }
        
        /* 选项卡导航 */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 5px;
        }
        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: #aaa;
        }
        .tab-btn.active {
            background: #ffd700;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(255,215,0,0.3);
        }
        
        /* 内容区域 */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .price-row:last-child {
            border-bottom: none;
        }
        
        .metal-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .metal-icon {
            width: 50px;
            height: 30px;
            border-radius: 6px;
            background: #ffd700;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .metal-name span {
            font-size: 20px;
            font-weight: 700;
        }
        
        .price-value {
            font-size: 20px;
            font-weight: 700;
            color: #ff6b6b;
        }
        
        .price-unit {
            font-size: 12px;
            color: #888;
            margin-left: 4px;
            font-weight: 400;
        }
        
        .brand-section {
            margin-top: 10px;
        }
        
        .brand-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .brand-name {
            color: #ccc;
            font-size: 20px;
            font-weight: 700;
        }
        
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #ffd700;
            padding: 15px 30px;
            border-radius: 40px;
            z-index: 2000;
            display: none;
            font-weight: 700;
            box-shadow: 0 0 20px #ffd70040;
            border: 1px solid #ffd700;
        }
        
        .toast.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .data-source-tip {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 10px;
            font-weight: 400;
        }

        .loading-tip {
            text-align: center;
            padding: 20px;
            color: #ffd700;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>贵金属实时报价</h1>
            <div class="update-time" id="updateTime">数据加载中...</div>
        </div>
        
        <!-- 选项卡导航 -->
        <div class="tab-nav">
            <div class="tab-btn active" data-tab="recycle">回收价格</div>
            <div class="tab-btn" data-tab="sale">销售价格</div>
        </div>
        
        <!-- 回收价格内容 -->
        <div id="recycleTab" class="tab-content active">
            <div class="section">
                <div class="section-title">回收价格（元/克）</div>
                <div id="recyclePrices">
                    <div class="loading-tip">⏳ 加载中...</div>
                </div>
            </div>
        </div>
        
        <!-- 销售价格内容 -->
        <div id="saleTab" class="tab-content">
            <div class="section">
                <div class="section-title">销售价格（元/克）</div>
                <div id="salePrices">
                    <div class="loading-tip">⏳ 加载中...</div>
                </div>
            </div>
        </div>
        
        <div class="data-source-tip">数据源: metals.live + exchangerate-api.com</div>
    </div>
    
    <!-- 提示消息 -->
    <div class="toast" id="toast">价格已更新</div>
    
    <script>
        // ==================== 固定差价配置（不可修改） ====================
        const PRICE_CONFIG = {
            recycle: {
                gold: 40,          // 黄金999
                gold990: 50,       // 黄金990
                silver: 4,         // 银999
                silver990: 5,      // 银990
                silver925: 7,      // 银925
                platinum: 120,
                palladium: 170
            },
            sale: {
                baosheng: 100,
                laofengxiang: 200,
                laomiao: 190,
                mengjinyuan: 180,
                zhongguo: 170,
                silver: 11
            }
        };

        // 最后一次成功获取的基础价格 (美元/盎司)
        let basePricesUSD = {
            gold: 1900.0,
            silver: 23.0,
            platinum: 900.0,
            palladium: 1000.0
        };
        // 最新汇率 (USD/CNY)
        let usdCnyRate = 7.2;

        // 显示提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 选项卡切换
        function initTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = {
                recycle: document.getElementById('recycleTab'),
                sale: document.getElementById('saleTab')
            };
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const target = tab.dataset.tab;
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    Object.keys(contents).forEach(key => {
                        contents[key].classList.remove('active');
                    });
                    contents[target].classList.add('active');
                });
            });
        }

        // ---------- 尾数处理函数 ----------
        // 向下取整至最近的0或5结尾
        function floorTo5or0(num) {
            const remainder = num % 10;
            if (remainder < 5) {
                return num - remainder; // 向下到0
            } else {
                return num - remainder + 5; // 向下到5
            }
        }

        // 向上取整至最近的8结尾
        function ceilTo8(num) {
            const remainder = num % 10;
            if (remainder <= 8) {
                return num - remainder + 8;
            } else {
                // remainder === 9
                return num + 10 - remainder + 8; // 等同于 num + 18 - remainder
            }
        }

        // 将美元/盎司转换为人民币/克
        function usdPerOunceToCnyPerGram(usdPrice) {
            return (usdPrice * usdCnyRate) / 31.10348;
        }

        // 获取实时数据（原子更新，支持CORS）
        async function fetchPrices() {
            try {
                // 同时请求汇率和贵金属现货价格（metals.live 支持 CORS）
                const [rateResponse, metalsResponse] = await Promise.all([
                    fetch('https://api.exchangerate-api.com/v4/latest/USD'),
                    fetch('https://api.metals.live/v1/spot')
                ]);

                if (!rateResponse.ok) throw new Error('汇率API响应失败');
                if (!metalsResponse.ok) throw new Error('金属价格API响应失败');

                const rateData = await rateResponse.json();
                const metalsData = await metalsResponse.json();

                const newRate = rateData.rates.CNY;
                if (!newRate) throw new Error('未获取到人民币汇率');

                // 从 metals.live 返回的数组中提取所需金属价格（美元/盎司）
                const findMetalPrice = (symbol) => {
                    const item = metalsData.find(m => m.metal === symbol);
                    if (!item || typeof item.price !== 'number') throw new Error(`未找到${symbol}价格`);
                    return item.price;
                };

                const newGold = findMetalPrice('XAU');
                const newSilver = findMetalPrice('XAG');
                const newPlatinum = findMetalPrice('XPT');
                const newPalladium = findMetalPrice('XPD');

                // ✅ 原子更新：所有新数据获取成功后才一次性更新全局状态
                usdCnyRate = newRate;
                basePricesUSD = {
                    gold: newGold,
                    silver: newSilver,
                    platinum: newPlatinum,
                    palladium: newPalladium
                };

                // 更新界面
                updateDisplay();
                showToast('价格已更新');
            } catch (error) {
                console.error('数据获取失败:', error);
                showToast('⚠️ 数据获取失败，使用缓存数据');
                // 仍然使用已有的 basePricesUSD 和 usdCnyRate 刷新显示
                updateDisplay();
            }
        }

        // 更新页面显示
        function updateDisplay() {
            // 计算人民币基础价格 (每克)
            const basePricesCNY = {
                gold: usdPerOunceToCnyPerGram(basePricesUSD.gold),
                silver: usdPerOunceToCnyPerGram(basePricesUSD.silver),
                platinum: usdPerOunceToCnyPerGram(basePricesUSD.platinum),
                palladium: usdPerOunceToCnyPerGram(basePricesUSD.palladium)
            };

            // ---------- 回收价格计算（黄金需尾数处理） ----------
            // 黄金999基础（未尾数）
            const gold999Base = basePricesCNY.gold - PRICE_CONFIG.recycle.gold;
            const gold999Final = floorTo5or0(Math.round(gold999Base));

            // 黄金990
            const gold990Base = basePricesCNY.gold - PRICE_CONFIG.recycle.gold990;
            const gold990Final = floorTo5or0(Math.round(gold990Base));

            // 黄金750、916基于黄金999最终价计算（系数 0.72 / 0.9）
            const gold750Final = floorTo5or0(Math.round(gold999Final * 0.72));
            const gold916Final = floorTo5or0(Math.round(gold999Final * 0.9));

            // 银及其他金属直接Math.round
            const silverFinal = Math.round(basePricesCNY.silver - PRICE_CONFIG.recycle.silver);
            const silver990Final = Math.round(basePricesCNY.silver - PRICE_CONFIG.recycle.silver990);
            const silver925Final = Math.round(basePricesCNY.silver - PRICE_CONFIG.recycle.silver925);
            const platinumFinal = Math.round(basePricesCNY.platinum - PRICE_CONFIG.recycle.platinum);
            const palladiumFinal = Math.round(basePricesCNY.palladium - PRICE_CONFIG.recycle.palladium);

            // 打包回收价格
            const recyclePrices = {
                gold: gold999Final,
                gold990: gold990Final,
                gold750: gold750Final,
                gold916: gold916Final,
                silver: silverFinal,
                silver990: silver990Final,
                silver925: silver925Final,
                platinum: platinumFinal,
                palladium: palladiumFinal
            };

            // ---------- 销售价格计算 ----------
            // 黄金品牌初步价
            const baoshengBase = basePricesCNY.gold + PRICE_CONFIG.sale.baosheng;
            const laofengxiangBase = basePricesCNY.gold + PRICE_CONFIG.sale.laofengxiang;
            const laomiaoBase = basePricesCNY.gold + PRICE_CONFIG.sale.laomiao;
            const mengjinyuanBase = basePricesCNY.gold + PRICE_CONFIG.sale.mengjinyuan;
            const zhongguoBase = basePricesCNY.gold + PRICE_CONFIG.sale.zhongguo;

            // 应用向上取整至8
            const salePrices = {
                baosheng: ceilTo8(Math.round(baoshengBase)),
                laofengxiang: ceilTo8(Math.round(laofengxiangBase)),
                laomiao: ceilTo8(Math.round(laomiaoBase)),
                mengjinyuan: ceilTo8(Math.round(mengjinyuanBase)),
                zhongguo: ceilTo8(Math.round(zhongguoBase)),
                silver: Math.round(basePricesCNY.silver + PRICE_CONFIG.sale.silver) // 足银不调整尾数
            };
            
            // 更新回收价格显示
            document.getElementById('recyclePrices').innerHTML = `
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au999</div>
                        <span>黄金999</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au990</div>
                        <span>黄金990</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold990}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au750</div>
                        <span>黄金750</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold750}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Au916</div>
                        <span>黄金916</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.gold916}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Ag999</div>
                        <span>银999</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.silver}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Ag990</div>
                        <span>银990</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.silver990}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Ag925</div>
                        <span>银925</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.silver925}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Pt</div>
                        <span>铂金</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.platinum}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
                <div class="price-row">
                    <div class="metal-name">
                        <div class="metal-icon">Pd</div>
                        <span>钯金</span>
                    </div>
                    <div>
                        <span class="price-value">${recyclePrices.palladium}</span>
                        <span class="price-unit">元/克</span>
                    </div>
                </div>
            `;
            
            // 更新销售价格显示
            document.getElementById('salePrices').innerHTML = `
                <div class="brand-section">
                    <div class="brand-item">
                        <span class="brand-name">宝盛黄金</span>
                        <div>
                            <span class="price-value">${salePrices.baosheng}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">老凤祥黄金</span>
                        <div>
                            <span class="price-value">${salePrices.laofengxiang}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">老庙黄金</span>
                        <div>
                            <span class="price-value">${salePrices.laomiao}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">梦金园黄金</span>
                        <div>
                            <span class="price-value">${salePrices.mengjinyuan}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">中国黄金</span>
                        <div>
                            <span class="price-value">${salePrices.zhongguo}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                    <div class="brand-item">
                        <span class="brand-name">足银</span>
                        <div>
                            <span class="price-value">${salePrices.silver}</span>
                            <span class="price-unit">元/克</span>
                        </div>
                    </div>
                </div>
            `;
            
            // 更新时间
            const now = new Date();
            document.getElementById('updateTime').innerHTML = 
                `更新时间：${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        // 初始化
        initTabs();
        fetchPrices();

        // 每30秒刷新一次
        setInterval(fetchPrices, 30000);
    </script>
</body>
</html>
